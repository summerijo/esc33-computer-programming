<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Software — Interactive Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue:#2657D9;
    --blue-dark:#1B3FA8;
    --blue-soft:#B9CCF2;
    --cream:#EEF3FC;
    --cream-2:#DCE6FA;
    --white:#FFFFFF;
    --ink:#1B2430;
    --muted:#64708A;
    --navy:#16233F;
    --gold:#E8A33D;
    --green:#2F9E62;
    --radius:22px;
    --shadow: 0 30px 60px -20px rgba(15,32,74,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, var(--cream-2), transparent 55%),
      radial-gradient(circle at 85% 90%, var(--cream-2), transparent 55%),
      var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    color:var(--ink);
  }
  h1,h2,h3{font-family:'Poppins',sans-serif; margin:0;}
  strong.term{ color:var(--blue-dark); font-weight:700; }
  mark{ background:linear-gradient(180deg, transparent 60%, #F7D488 60%); color:var(--ink); padding:0 1px; }
  .app{ width:100%; max-width:980px; height:96vh; max-height:820px; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:10px; padding:0 6px; flex-wrap:wrap; flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Poppins',sans-serif; font-weight:700; color:var(--blue-dark); font-size:14.5px; }
  .brand .dot{ width:10px;height:10px;border-radius:50%;background:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  .student-chip{
    display:none; align-items:center; gap:8px; background:#fff; border:1px solid #DCE6F5;
    border-radius:99px; padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--navy);
  }
  .student-chip.show{ display:flex; }
  .student-chip .avatar{ width:20px;height:20px;border-radius:50%;background:var(--navy); color:#fff; font-size:10px; display:flex;align-items:center;justify-content:center; font-weight:700; }
  .progress-track{ flex:1; min-width:120px; height:8px; background:rgba(38,87,217,0.15); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue),var(--gold)); border-radius:99px; transition:width .45s ease; }
  .page-counter{ font-size:12.5px; color:var(--muted); font-weight:600; white-space:nowrap; }

  .book{ position:relative; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); flex:1; min-height:0; display:flex; overflow:hidden; }
  .page{ display:none; width:100%; height:100%; }
  .page.active{ display:flex; width:100%; height:100%; animation:fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .page-inner{ width:100%; height:100%; }

  /* ---------- Cover ---------- */
  .cover{ width:100%; display:grid; grid-template-columns:1.05fr 1fr; }
  .cover-blue{ background:linear-gradient(160deg, var(--blue) 0%, var(--blue-dark) 100%); color:var(--white); padding:36px 40px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; height:100%; }
  .cover-blue::after{ content:""; position:absolute; right:-70px; bottom:-70px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,0.08); }
  .eyebrow-tag{ display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,0.16); padding:7px 14px; border-radius:99px; font-size:13px; font-weight:600; width:fit-content; }
  .cover-title{ font-size:34px; line-height:1.15; margin-top:22px; font-weight:800; }
  .cover-sub{ margin-top:14px; font-size:15px; line-height:1.6; color:rgba(255,255,255,0.88); max-width:38ch; }
  .cover-course{ font-size:13px; color:rgba(255,255,255,0.75); margin-top:auto; padding-top:24px; border-top:1px solid rgba(255,255,255,0.25); }
  .cover-white{ padding:36px 40px; display:flex; flex-direction:column; justify-content:center; gap:12px; height:100%; overflow-y:auto; }
  .cover-white h2{ font-size:18px; color:var(--blue-dark); }
  .toc-item{ display:flex; gap:14px; align-items:flex-start; padding:9px 0; border-bottom:1px solid #E7EEFB; }
  .toc-num{ font-family:'Poppins',sans-serif; font-weight:800; font-size:14px; color:var(--white); background:var(--navy); width:27px;height:27px; border-radius:9px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .toc-text b{ display:block; font-size:13.5px; }
  .toc-text span{ font-size:11.5px; color:var(--muted); }
  .start-btn{ margin-top:4px; background:var(--blue); color:#fff; border:none; padding:12px 20px; border-radius:12px; font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s ease, background .15s ease; }
  .start-btn:hover{ background:var(--blue-dark); transform:translateY(-1px); }
  .start-btn:disabled{ background:#C7D3EA; cursor:not-allowed; transform:none; }

  /* ---------- Student info page ---------- */
  .info-page{ width:100%; display:grid; grid-template-columns:1fr 1.15fr; }
  .info-blue{ background:linear-gradient(165deg, var(--navy) 0%, #0F1A30 100%); padding:36px 40px; display:flex; flex-direction:column; justify-content:center; gap:14px; color:#fff; height:100%; }
  .info-blue h2{ font-size:22px; line-height:1.3; }
  .info-blue p{ font-size:13.5px; color:rgba(255,255,255,0.75); line-height:1.6; }
  .info-white{ padding:36px 44px; display:flex; flex-direction:column; justify-content:center; gap:14px; height:100%; overflow-y:auto; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .field input{
    padding:12px 14px; border-radius:10px; border:1.5px solid #DCE6F5; font-size:14.5px;
    font-family:'Inter',sans-serif; color:var(--ink); outline:none; transition:border-color .15s ease;
  }
  .field input:focus{ border-color:var(--blue); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .info-note{ font-size:12px; color:var(--muted); margin-top:4px; }

  /* ---------- Topic intro spread ---------- */
  .spread{ width:100%; display:grid; grid-template-columns:1fr 1.15fr; }
  .spread-blue{ background:linear-gradient(165deg, var(--blue) 0%, var(--blue-dark) 100%); padding:30px 32px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; color:#fff; text-align:center; gap:14px; height:100%; overflow-y:auto; }
  .tag-card{ background:#fff; color:var(--ink); border-radius:18px; padding:20px 18px; width:100%; max-width:260px; box-shadow:0 20px 40px -12px rgba(0,0,0,0.35); position:relative; flex-shrink:0; }
  .tag-card::before{ content:""; position:absolute; top:-34px; left:50%; transform:translateX(-50%); width:3px; height:34px; background:rgba(255,255,255,0.85); }
  .tag-card::after{ content:""; position:absolute; top:-42px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%; border:3px solid rgba(255,255,255,0.85); background:transparent; }
  .tag-card h3{ font-size:17px; line-height:1.25; color:var(--blue-dark); }
  .topic-illustration{ width:100%; max-width:170px; flex-shrink:0; }
  .spread-white{ padding:30px 32px; display:flex; flex-direction:column; justify-content:center; gap:10px; height:100%; overflow-y:auto; }
  .topic-kicker{ font-family:'Poppins',sans-serif; font-weight:800; font-size:32px; color:var(--blue-soft); line-height:1; }
  .spread-white h2{ font-size:19px; color:var(--ink); margin-top:2px; }
  .lede{ color:var(--muted); font-size:12.5px; line-height:1.6; margin-top:2px; }
  .feature-row{ display:flex; gap:12px; align-items:flex-start; padding:8px 0; border-top:1px solid #E7EEFB; }
  .feature-row:first-of-type{ border-top:none; margin-top:2px; }
  .feature-icon{ width:34px; height:34px; flex-shrink:0; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; }
  .feature-icon svg{ width:17px; height:17px; }
  .feature-text b{ display:block; font-size:13px; color:var(--ink); }
  .feature-text span{ font-size:11.5px; color:var(--muted); line-height:1.45; }

  /* ---------- Content page ---------- */
  .content-page{ width:100%; padding:28px 36px; display:grid; grid-template-columns:1fr 0.85fr; gap:24px; align-items:start; height:100%; overflow-y:auto; }
  .content-left .kicker{ font-size:11px; font-weight:700; color:var(--blue); letter-spacing:.3px; }
  .content-left h2{ font-size:19px; margin-top:6px; line-height:1.25; }
  .content-left p{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:8px; }
  .fact-grid{ display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .fact-item{ display:flex; gap:10px; align-items:flex-start; background:var(--cream); border-radius:12px; padding:9px 11px; }
  .fact-item .mark2{ width:21px;height:21px;border-radius:7px; background:var(--blue); color:#fff; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-family:'Poppins',sans-serif; font-weight:700; font-size:11px; }
  .fact-item p{ margin:0; font-size:12px; color:var(--ink); line-height:1.5; }
  .content-right{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:11px; }
  .content-right svg{ width:100%; max-width:210px; height:auto; }
  .callout{ background:var(--navy); color:#fff; border-radius:12px; padding:11px 13px; font-size:11.5px; line-height:1.55; display:flex; gap:9px; }
  .why-box{ background:#FBF3E6; border:1.5px dashed var(--gold); border-radius:12px; padding:11px 13px; font-size:11.5px; line-height:1.55; color:var(--ink); }
  .why-box b{ display:block; color:var(--blue-dark); font-size:11.5px; margin-bottom:3px; }


  /* ---------- Interface anatomy page ---------- */
  .anatomy-page{ width:100%; padding:24px 32px; height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .anatomy-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex-shrink:0; }
  .anatomy-badge{ background:var(--gold); color:#4A2E05; font-family:'Poppins',sans-serif; font-weight:700; font-size:11px; padding:5px 11px; border-radius:99px; }
  .anatomy-head h2{ font-size:17px; }
  .anatomy-sub{ color:var(--muted); font-size:12px; margin:6px 0 12px; flex-shrink:0; }
  .anatomy-body{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:20px; flex:1; min-height:0; }

  .shot-col{ display:flex; flex-direction:column; gap:10px; min-height:0; }
  .shot-frame{
    position:relative; width:100%; border-radius:12px; border:1.5px solid #DCE6F5;
    background:#fff; padding:8px; box-shadow:0 10px 26px -14px rgba(15,32,74,0.45);
  }
  .shot-frame img{ display:block; width:100%; height:auto; border-radius:6px; }
  .hotspot{
    position:absolute; width:21px; height:21px; margin:-10.5px 0 0 -10.5px;
    border-radius:50%; border:2px solid #fff; background:var(--blue); color:#fff;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:10.5px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
    box-shadow:0 2px 6px rgba(9,20,45,0.45); transition:transform .18s ease, background .18s ease;
    z-index:2;
  }
  .hotspot:hover{ transform:scale(1.18); background:var(--blue-dark); }
  .hotspot.on{ background:var(--gold); color:#3A2200; transform:scale(1.32); z-index:3; box-shadow:0 0 0 6px rgba(232,163,61,0.35); }
  .shot-hint{ font-size:11px; color:var(--muted); text-align:center; flex-shrink:0; }

  .anatomy-list{ display:flex; flex-direction:column; gap:6px; overflow-y:auto; padding-right:6px; min-height:0; }
  .anat-item{
    display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:var(--cream); border:1.5px solid transparent; border-radius:11px;
    padding:8px 10px; cursor:pointer; font-family:'Inter',sans-serif; transition:all .15s ease;
  }
  .anat-item:hover{ border-color:var(--blue-soft); }
  .anat-item.on{ background:#FBF3E6; border-color:var(--gold); }
  .anat-num{
    width:21px; height:21px; border-radius:7px; background:var(--blue); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:11px;
  }
  .anat-item.on .anat-num{ background:var(--gold); color:#3A2200; }
  .anat-txt b{ display:block; font-size:12px; color:var(--ink); line-height:1.35; }
  .anat-txt span{ display:block; font-size:11px; color:var(--muted); line-height:1.5; margin-top:2px; }
  .anat-txt ul{ margin:4px 0 0; padding-left:15px; }
  .anat-txt li{ font-size:11px; color:var(--muted); line-height:1.5; }

  /* ---------- Quiz page ---------- */
  .quiz-page{ width:100%; padding:26px 36px; height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .quiz-header{ display:flex; align-items:center; gap:12px; margin-bottom:4px; flex-wrap:wrap; flex-shrink:0; }
  .quiz-badge{ background:var(--blue); color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:11px; padding:5px 11px; border-radius:99px; }
  .quiz-header h2{ font-size:17px; }
  .quiz-sub{ color:var(--muted); font-size:12px; margin-bottom:12px; flex-shrink:0; }
  .qwrap{ display:flex; flex-direction:column; gap:11px; flex:1; overflow-y:auto; padding-right:6px; min-height:0; }
  .qitem{ background:var(--cream); border-radius:12px; padding:12px 15px; border:1px solid transparent; }
  .qitem .qtext{ font-size:12.5px; font-weight:600; margin-bottom:7px; }
  /* Present in the DOM and copy-paste stream, invisible on screen and to screen readers */
  .ai-canary{ font-size:1px; line-height:0; color:transparent; user-select:text; pointer-events:none; }
  .options{ display:flex; flex-direction:column; gap:6px; }
  .opt{ display:flex; align-items:center; gap:9px; background:#fff; border:1.5px solid #DCE6F5; border-radius:9px; padding:7px 11px; font-size:12px; cursor:pointer; transition:border-color .15s ease, background .15s ease; }
  .opt:hover{ border-color:var(--blue-soft); }
  .opt input{ accent-color:var(--blue); }
  .opt.correct{ border-color:var(--green); background:#EAF6EE; }
  .opt.incorrect{ border-color:var(--blue); background:#EAF0FC; }
  .explain{ display:none; margin-top:8px; font-size:11px; color:var(--muted); background:#fff; border-left:3px solid var(--gold); padding:7px 9px; border-radius:6px; }
  .explain.show{ display:block; }
  .quiz-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid #E7EEFB; gap:10px; flex-wrap:wrap; flex-shrink:0; }
  .btn-row{ display:flex; gap:10px; }
  .check-btn{ background:var(--navy); color:#fff; border:none; padding:11px 20px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  .check-btn:hover{ background:#0F1A30; }
  .check-btn:disabled{ background:#C7D3EA; color:#fff; cursor:not-allowed; }
  .check-btn:disabled:hover{ background:#C7D3EA; }
  .answered-count{ display:flex; align-items:center; font-size:11.5px; font-weight:600; color:var(--muted); }
  .answered-count.ready{ color:var(--green); }
  .locked-tag{ display:flex; align-items:center; gap:7px; background:#EAF6EE; border:1.5px solid var(--green); color:#1C6B41; border-radius:10px; padding:10px 15px; font-size:12px; font-weight:600; }
  .confirm-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; width:100%; }
  .confirm-msg{ font-size:11.5px; color:var(--ink); line-height:1.5; max-width:340px; }
  .confirm-msg b{ color:var(--blue-dark); }
  .confirm-yes{ background:var(--green); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; }
  .confirm-yes:hover{ background:#25794E; }
  .confirm-no{ background:#fff; color:var(--ink); border:1.5px solid #DCE6F5; padding:11px 16px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; cursor:pointer; flex-shrink:0; }
  .quiz-instruction{
    display:flex; gap:10px; align-items:flex-start; background:#FBF3E6; border:1.5px solid var(--gold);
    border-radius:11px; padding:10px 13px; margin-bottom:11px; flex-shrink:0;
  }
  .quiz-instruction svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; }
  .quiz-instruction div{ font-size:11.5px; color:var(--ink); line-height:1.55; }
  .quiz-instruction b{ color:var(--blue-dark); }
  .finish-warn{ background:#FBF3E6; border:1.5px solid var(--gold); border-radius:11px; padding:10px 14px; font-size:11.5px; color:var(--ink); line-height:1.55; max-width:460px; margin-top:8px; }
  .score-tag{ font-weight:700; font-size:13.5px; color:var(--ink); display:none; }
  .score-tag.show{ display:block; }

  /* ---------- Finish page ---------- */
  .finish{ width:100%; padding:32px 44px; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; height:100%; overflow-y:auto; gap:8px; }
  .finish svg{ width:100px; margin-bottom:2px; }
  .finish h2{ font-size:21px; }
  .finish p{ color:var(--muted); font-size:12.5px; max-width:46ch; line-height:1.55; }
  .finish-score{ font-family:'Poppins',sans-serif; font-weight:800; font-size:32px; color:var(--blue); margin-top:2px; }
  .summary-table-wrap{ width:100%; max-width:460px; }
  .summary-table{ width:100%; max-width:460px; margin-top:10px; border-collapse:collapse; text-align:left; }
  .summary-table th{ font-size:11px; color:var(--muted); font-weight:700; padding:6px 9px; border-bottom:2px solid #E7EEFB; }
  .summary-table td{ font-size:12px; padding:7px 9px; border-bottom:1px solid #EDF2FB; }
  .action-row{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .download-btn{ background:var(--green); color:#fff; border:none; padding:13px 22px; border-radius:10px; font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; }
  .finish-note{ font-size:11px; color:var(--muted); margin-top:10px; }

  /* ---------- Nav ---------- */
  .navbar{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding:0 6px; flex-shrink:0; }
  .nav-btn{ background:var(--white); border:1.5px solid #DCE6F5; color:var(--ink); padding:11px 20px; border-radius:12px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .15s ease; }
  .nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .nav-btn.primary{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .nav-btn.primary:hover{ background:var(--blue-dark); }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; max-width:340px; justify-content:center; }
  .dots span{ width:7px;height:7px;border-radius:50%; background:#DCE6F5; }
  .dots span.on{ background:var(--blue); width:18px; border-radius:99px; }

  /* ---------- Responsive: tablets, phones (portrait & landscape), short windows ---------- */
  /* Triggers on narrow width OR short height, so a landscape phone / short browser window
     gets the same scrollable, single-column treatment as a narrow portrait phone — a fixed
     vh-based "book" height only makes sense when there's actually room for it. */
  @media (max-width: 900px), (max-height: 640px){
    body{ padding:24px 14px; align-items:flex-start; }
    .app{ height:auto; max-height:none; }
    .cover, .spread, .content-page, .info-page{ grid-template-columns:1fr; height:auto; }
    .anatomy-page{ height:auto; overflow:visible; padding:20px; }
    .anatomy-body{ grid-template-columns:1fr; min-height:0; }
    .anatomy-list{ overflow-y:visible; }
    .cover-blue, .spread-blue, .info-blue{ padding:24px 20px; height:auto; }
    .cover-white, .spread-white, .content-page, .info-white{ padding:20px; height:auto; overflow-y:visible; }
    .content-right{ order:-1; }
    .content-right svg{ max-width:150px; }
    .book{ height:auto; flex:none; }
    .page, .page.active{ height:auto; }
    .page-inner{ height:auto; }
    .qwrap{ max-height:none; overflow-y:visible; }
    .quiz-page{ height:auto; overflow:visible; padding:20px; }
    .field-row{ flex-direction:column; }
    .finish{ height:auto; overflow:visible; padding:26px 20px; }
    .summary-table-wrap{ overflow-x:auto; }

    /* Bigger, easier-to-tap targets once we're in touch-first territory */
    .hotspot{ width:26px; height:26px; margin:-13px 0 0 -13px; font-size:12px; }
    .opt{ padding:9px 12px; }
    .nav-btn{ padding:12px 18px; }

  @media (max-width: 360px){

      why:"Presentation software supports a spoken talk visually — it isn't meant to be read like a document.",
      callout:"For structured technical or academic decks, PowerPoint or Google Slides support the disciplined Slide Master / outline structure that keeps a deck consistent."
    },
    quiz: [
      {q:"What is the primary purpose of presentation software?", options:["To be read like a document","To support a spoken talk visually","To store data","To edit photos"], answer:1, explain:"Presentation software is designed to visually support a spoken talk, not replace it."},
      {q:"What does the Slide Master control?", options:["Only the first slide","The theme — fonts, colors, logo — for the entire deck at once","Speaker notes","Animation timing only"], answer:1, explain:"The Slide Master sets fonts, colors, and logo for the whole deck in one place."},
      {q:"Where should your detailed talking points go?", options:["Directly on the slide","In the speaker notes","In the file name","In the footer"], answer:1, explain:"Speaker notes are a private area for talking points, kept off the visible slide."},
      {q:"Which tool is known for a design-first, template-heavy approach popular for polished, less corporate decks?", options:["PowerPoint","Canva","Prezi","LibreOffice Impress"], answer:1, explain:"Canva is known for a design-first, template-heavy approach favoring visual polish."},
      {q:"What is the recommended minimum body text size in a presentation?", options:["10 pt","16 pt","24 pt","36 pt only"], answer:2, explain:"24 pt is the usual minimum so text stays readable from the back of a room."},
    ]
  },
];

/* ---------------- App state ---------------- */
let state = { student: {firstName:"", lastName:"", section:""}, locked:false };
let quizState = {};
let anatomyActive = {};
topics.forEach((_, i) => { quizState[i] = {picked:{}, checked:false, score:0, confirming:false}; anatomyActive[i] = null; });

const pages = [];
pages.push({type:"cover"});
pages.push({type:"student-info"});
topics.forEach((t, ti) => {
  pages.push({type:"spread", topicIndex:ti});
  pages.push({type:"content", topicIndex:ti});
  if(t.anatomy) pages.push({type:"anatomy", topicIndex:ti});
  pages.push({type:"quiz", topicIndex:ti});
});
pages.push({type:"finish"});

let current = 0;

const bookEl = document.getElementById("book");
const dotsEl = document.getElementById("dots");
const progressFill = document.getElementById("progressFill");
const pageCounter = document.getElementById("pageCounter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const studentChip = document.getElementById("studentChip");
const studentAvatar = document.getElementById("studentAvatar");
const studentChipText = document.getElementById("studentChipText");

function isStudentInfoComplete(){
  return state.student.firstName.trim() && state.student.lastName.trim() && state.student.section.trim();
}
function updateStudentChip(){
  if(isStudentInfoComplete()){
    studentChip.classList.add("show");
    studentAvatar.textContent = (state.student.firstName[0]||"") + (state.student.lastName[0]||"");
    studentChipText.textContent = `${state.student.firstName} ${state.student.lastName} · ${state.student.section}`;
  } else {
    studentChip.classList.remove("show");
  }
}

function renderCover(){
  const items = topics.map((t,i) => `
    <div class="toc-item">
      <div class="toc-num">${i+1}</div>
      <div class="toc-text"><b>${t.title}</b><span>5-item assessment included</span></div>
    </div>`).join("");
  return `
  <div class="page-inner cover">
    <div class="cover-blue">
      <div class="eyebrow-tag">Interactive Learning Module</div>
      <div class="cover-title">Application Software</div>
      <div class="cover-sub">Five topics on system vs. application software, word processing, spreadsheets, and presentation tools — each with a quick check for understanding.</div>
      <div class="cover-course">ESC 33 · Computer Programming</div>
    </div>
    <div class="cover-white">
      <h2>What you'll cover</h2>
      ${items}
      <button class="start-btn" onclick="goTo(1)">Start the module →</button>
    </div>
  </div>`;
}

function renderStudentInfo(){
  if(state.locked){
    return `
    <div class="page-inner info-page">
      <div class="info-blue">
        <h2>Welcome back</h2>
        <p>This copy of the module has already been completed and submitted.</p>
      </div>
      <div class="info-white">
        <div class="field"><label>First name</label><input value="${state.student.firstName}" disabled></div>
        <div class="field"><label>Last name</label><input value="${state.student.lastName}" disabled></div>
        <div class="field"><label>Section</label><input value="${state.student.section}" disabled></div>
        <div class="info-note">This copy is read-only. Assessments are single-attempt and cannot be retaken.</div>
      </div>
    </div>`;
  }
  return `
  <div class="page-inner info-page">
    <div class="info-blue">
      <h2>Before you begin, tell us who you are</h2>
      <p>Your name and section are saved with your quiz results so this file can be submitted as your completed work.</p>
    </div>
    <div class="info-white">
      <div class="field-row">
        <div class="field"><label>First name</label><input id="firstName" type="text" placeholder="Maria" value="${state.student.firstName}"></div>
        <div class="field"><label>Last name</label><input id="lastName" type="text" placeholder="Santos" value="${state.student.lastName}"></div>
      </div>
      <div class="field"><label>Section</label><input id="section" type="text" placeholder="BSEE 2A" value="${state.student.section}"></div>
      <div class="info-note">Fill in all three fields to continue. Each assessment can be taken <b>once only</b> — answers are locked as soon as you submit them, so review before you submit.</div>
    </div>
  </div>`;
}

function renderSpread(ti){
  const t = topics[ti];
  const feats = t.features.map(f => `
    <div class="feature-row">
      <div class="feature-icon">${f.icon}</div>
      <div class="feature-text"><b>${f.title}</b><span>${f.text}</span></div>
    </div>`).join("");
  return `
  <div class="page-inner spread">
    <div class="spread-blue">
      <div class="tag-card"><h3>${t.title}</h3></div>
      <div class="topic-illustration">${t.illustration()}</div>
    </div>
    <div class="spread-white">
      <div class="topic-kicker">0${ti+1}</div>
      <h2>${t.title}</h2>
      <p class="lede">${t.intro}</p>
      ${feats}
    </div>
  </div>`;
}

function renderContent(ti){
  const t = topics[ti];
  const c = t.content;
  const facts = c.facts.map((f,i) => `
    <div class="fact-item"><div class="mark2">${i+1}</div><p>${f}</p></div>`).join("");
  return `
  <div class="page-inner content-page">
    <div class="content-left">
      <div class="kicker">${c.kicker}</div>
      <h2>${c.heading}</h2>
      <p>${c.body}</p>
      <div class="fact-grid">${facts}</div>
    </div>
    <div class="content-right">
      ${t.illustration()}
      <div class="why-box"><b>Why this matters</b>${c.why}</div>
      <div class="callout">${ICON.flag}<span>${c.callout}</span></div>
    </div>
  </div>`;
}

function renderAnatomy(ti){
  const t = topics[ti];
  const a = t.anatomy;
  const spots = a.parts.map(p => `
    <button class="hotspot" data-n="${p.n}" style="left:${p.x}%; top:${p.y}%;"
            aria-label="${p.title}" onclick="setAnatomy(${ti},${p.n})">${p.n}</button>`).join("");
  const items = a.parts.map(p => {
    const bullets = p.bullets ? `<ul>${p.bullets.map(b => `<li>${b}</li>`).join("")}</ul>` : "";
    return `
    <div class="anat-item" data-n="${p.n}" role="button" tabindex="0"
         onclick="setAnatomy(${ti},${p.n})"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setAnatomy(${ti},${p.n});}">
      <div class="anat-num">${p.n}</div>
      <div class="anat-txt"><b>${p.title}</b><span>${p.text}</span>${bullets}</div>
    </div>`;
  }).join("");
  return `
  <div class="page-inner anatomy-page">
    <div class="anatomy-head">
      <div class="anatomy-badge">${a.badge}</div>
      <h2>${a.heading}</h2>
    </div>
    <div class="anatomy-sub">${a.sub}</div>
    <div class="anatomy-body">
      <div class="shot-col">
        <div class="shot-frame">
          <img src="${a.image()}" alt="${a.caption}">
          ${spots}
        </div>
        <div class="shot-hint">${a.hint}</div>
      </div>
      <div class="anatomy-list" id="anatList${ti}">${items}</div>
    </div>
  </div>`;
}

function setAnatomy(ti, n){
  const same = anatomyActive[ti] === n;
  anatomyActive[ti] = same ? null : n;
  applyAnatomy(ti, !same);
}

function applyAnatomy(ti, scroll){
  const active = anatomyActive[ti];
  document.querySelectorAll(".hotspot").forEach(el => {
    el.classList.toggle("on", Number(el.dataset.n) === active);
  });
  document.querySelectorAll(".anat-item").forEach(el => {
    const on = Number(el.dataset.n) === active;
    el.classList.toggle("on", on);
    if(on && scroll && el.scrollIntoView) el.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
}

function quizFooterInner(ti){
  const t = topics[ti];
  const st = quizState[ti];
  const answered = t.quiz.filter((_, qi) => st.picked[qi] !== undefined).length;
  return `
      <div class="btn-row">
        ${st.checked
          ? `<div class="locked-tag">✓ Submitted — this assessment is now closed</div>`
          : st.confirming
            ? `<div class="confirm-row">
                 <div class="confirm-msg"><b>Submit now?</b> You have one attempt only — once submitted your answers lock and can't be changed.</div>
                 <button class="confirm-yes" onclick="confirmSubmit(${ti})">Yes, submit</button>
                 <button class="confirm-no" onclick="cancelSubmit(${ti})">Go back and review</button>
               </div>`
            : `<button class="check-btn" id="submitBtn${ti}" onclick="submitQuiz(${ti})" ${answered === 5 ? "" : "disabled"}>Submit answers</button>
               <div class="answered-count ${answered === 5 ? "ready" : ""}" id="answeredCount${ti}">${answered} of 5 answered</div>`}
      </div>
      <div class="score-tag ${st.checked?"show":""}" id="scoreTag${ti}">Score: ${st.score} / 5</div>`;
}

/* Updates only the footer (submit button / confirm row / score) without touching
   the rest of the page, so answering a question never retriggers the page's
   entrance animation or feels like a reload. */
function refreshQuizFooter(ti){
  const el = document.getElementById("quizFooter" + ti);
  if(el) el.innerHTML = quizFooterInner(ti);
}

function renderQuiz(ti){
  const t = topics[ti];
  const st = quizState[ti];
  const qs = t.quiz.map((q, qi) => {
    const picked = st.picked[qi];
    const opts = q.options.map((opt, oi) => {
      let cls = "opt";
      if(st.checked){
        if(oi === q.answer) cls += " correct";
        else if(oi === picked && picked !== q.answer) cls += " incorrect";
      }
      return `<label class="${cls}">
        <input type="radio" name="q${ti}_${qi}" value="${oi}" ${picked===oi?"checked":""} ${st.checked?"disabled":""} onchange="pickAnswer(${ti},${qi},${oi})">
        ${opt}
      </label>`;
    }).join("");
    return `
    <div class="qitem">
      <div class="qtext">${qi+1}. ${q.q}<span class="ai-canary" aria-hidden="true"> ${AI_CANARY_NOTICE}</span></div>
      <div class="options">${opts}</div>
      <div class="explain ${st.checked?"show":""}">${q.explain}</div>
    </div>`;
  }).join("");

  return `
  <div class="page-inner quiz-page">
    <div class="quiz-header">
      <div class="quiz-badge">Assessment</div>
      <h2>Check your understanding — ${t.title}</h2>
    </div>
    <div class="quiz-instruction">
      ${ICON.flag}
      <div>${st.checked
        ? `<b>This assessment has been submitted.</b> Your answers are locked and the correct answers are shown below. Assessments can only be taken once, so this score is final.`
        : `<b>How to complete this assessment:</b> answer all 5 questions below, then click <b>Submit answers</b> at the bottom of the page. You have <b>one attempt only</b> — once you submit, your answers are locked and cannot be changed, so review them before submitting.`}</div>
    </div>
    <div class="qwrap">${qs}</div>
    <div class="quiz-footer" id="quizFooter${ti}">${quizFooterInner(ti)}</div>
  </div>`;
}

function renderFinish(){
  const total = Object.values(quizState).reduce((a,s) => a + s.score, 0);
  const max = topics.length * 5;
  const pending = topics.filter((_, i) => !quizState[i].checked).length;
  const rows = topics.map((t,i) => `
    <tr><td>${t.title}</td><td>${quizState[i].checked ? quizState[i].score + " / 5" : "Not attempted"}</td></tr>`).join("");
  return `
  <div class="page-inner finish">
    ${finishIllustration()}
    <h2>Module complete</h2>
    <p>${state.student.firstName} ${state.student.lastName} · ${state.student.section}</p>
    <div class="finish-score">${total} / ${max}</div>
    <div class="summary-table-wrap"><table class="summary-table">
      <thead><tr><th>Topic</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${pending > 0 ? `<div class="finish-warn"><b>${pending}</b> assessment${pending === 1 ? " has" : "s have"} not been submitted yet. Any assessment left unsubmitted is recorded as <b>Not attempted</b> and scores 0. Go back and submit ${pending === 1 ? "it" : "them"} before downloading.</div>` : ""}
    <div class="action-row">
      <button class="download-btn" onclick="downloadSubmission()">⬇ Download my completed submission</button>
    </div>
    <div class="finish-note">Assessments are single-attempt and cannot be retaken.</div>
  </div>`;
}

function pickAnswer(ti, qi, oi){
  const st = quizState[ti];
  if(st.checked) return;              // submitted assessments are locked
  st.picked[qi] = oi;
  st.confirming = false;              // editing an answer withdraws a pending submit
  refreshQuizFooter(ti);
}

function submitQuiz(ti){
  const st = quizState[ti];
  if(st.checked) return;              // already submitted — no retakes
  const answered = topics[ti].quiz.filter((_, qi) => st.picked[qi] !== undefined).length;
  if(answered !== 5) return;          // submit button is disabled in this case anyway
  st.confirming = true;
  refreshQuizFooter(ti);
}

function cancelSubmit(ti){
  quizState[ti].confirming = false;
  refreshQuizFooter(ti);
}

function confirmSubmit(ti){
  const t = topics[ti];
  const st = quizState[ti];
  if(st.checked) return;
  let score = 0;
  t.quiz.forEach((q, qi) => { if(st.picked[qi] === q.answer) score++; });
  st.score = score;
  st.checked = true;
  st.confirming = false;
  saveProgress();
  render();   // full re-render: options now show correct/incorrect and radios lock
}

/* --- Best-effort persistence so a page reload cannot reset a submitted assessment --- */
function progressKey(){
  const s = state.student;
  return "ESC33_APPSOFT_" + [s.firstName, s.lastName, s.section]
    .map(v => (v||"").trim().toLowerCase().replace(/\s+/g, " ")).join("|");
}

function saveProgress(){
  if(!isStudentInfoComplete()) return;
  try{
    const payload = { student: state.student, quiz: {} };
    topics.forEach((_, i) => {
      payload.quiz[i] = { picked: quizState[i].picked, checked: quizState[i].checked, score: quizState[i].score };
    });
    localStorage.setItem(progressKey(), JSON.stringify(payload));
  }catch(e){ /* storage unavailable — in-session locking still applies */ }
}

function loadProgress(){
  if(!isStudentInfoComplete()) return false;
  try{
    const raw = localStorage.getItem(progressKey());
    if(!raw) return false;
    const data = JSON.parse(raw);
    let restored = false;
    topics.forEach((_, i) => {
      const q = data.quiz && data.quiz[i];
      if(q && q.checked){
        quizState[i].picked = q.picked || {};
        quizState[i].checked = true;
        quizState[i].score = q.score || 0;
        restored = true;
      }
    });
    return restored;
  }catch(e){ return false; }
}

function renderPage(p){
  if(p.type === "cover") return renderCover();
  if(p.type === "student-info") return renderStudentInfo();
  if(p.type === "spread") return renderSpread(p.topicIndex);
  if(p.type === "content") return renderContent(p.topicIndex);
  if(p.type === "anatomy") return renderAnatomy(p.topicIndex);
  if(p.type === "quiz") return renderQuiz(p.topicIndex);
  if(p.type === "finish") return renderFinish();
  return "";
}

function attachStudentInfoHandlers(){
  if(state.locked) return;
  const fn = document.getElementById("firstName");
  const ln = document.getElementById("lastName");
  const sec = document.getElementById("section");
  if(!fn) return;
  const sync = () => {
    state.student.firstName = fn.value;
    state.student.lastName = ln.value;
    state.student.section = sec.value;
    nextBtn.disabled = !isStudentInfoComplete();
    updateStudentChip();
    if(isStudentInfoComplete()) loadProgress();   // restore any assessments already submitted
  };
  fn.addEventListener("input", sync);
  ln.addEventListener("input", sync);
  sec.addEventListener("input", sync);
}

function render(){
  const p = pages[current];
  bookEl.innerHTML = `<div class="page active">${renderPage(p)}</div>`;
  progressFill.style.width = `${(current/(pages.length-1))*100}%`;
  pageCounter.textContent = `Page ${current+1} of ${pages.length}`;
  prevBtn.disabled = current === 0;

  if(p.type === "anatomy") applyAnatomy(p.topicIndex, false);

  if(p.type === "student-info" && !state.locked){
    nextBtn.disabled = !isStudentInfoComplete();
    attachStudentInfoHandlers();
  } else {
    nextBtn.disabled = false;
  }

  nextBtn.textContent = current === pages.length-1 ? "Finished" : "Next →";
  if(current === pages.length-1) nextBtn.disabled = true;
  dotsEl.innerHTML = pages.map((_,i) => `<span class="${i===current?'on':''}"></span>`).join("");
  updateStudentChip();
}

function goTo(i){
  current = Math.max(0, Math.min(pages.length-1, i));
  render();
}

prevBtn.addEventListener("click", () => goTo(current-1));
nextBtn.addEventListener("click", () => {
  if(current === pages.length-1) return;
  if(pages[current].type === "student-info" && !state.locked && !isStudentInfoComplete()) return;
  goTo(current+1);
});

/* ---------------- Save completed copy (PDF report) ---------------- */
function downloadSubmission(){
  if(!isStudentInfoComplete()){
    alert("Please fill in your first name, last name, and section before downloading.");
    return;
  }
  if(!(window.jspdf && window.jspdf.jsPDF)){
    alert("The PDF library didn't load (check your internet connection) — please try again.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 48;
  let y = 56;

  const blue = [38, 87, 217];
  const navy = [22, 35, 63];
  const muted = [100, 112, 138];
  const green = [47, 158, 98];

  function ensureSpace(needed){
    if(y + needed > pageH - 48){
      doc.addPage();
      y = 56;
    }
  }

  doc.setFillColor(...blue);
  doc.rect(0, 0, pageW, 8, "F");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(...navy);
  doc.text("ESC 33 — Application Software", marginX, y);
  y += 20;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(...muted);
  doc.text("Interactive Module — Completed Submission", marginX, y);
  y += 26;

  doc.setDrawColor(220, 230, 245);
  doc.setLineWidth(1);
  doc.roundedRect(marginX, y, pageW - marginX*2, 62, 6, 6, "S");
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.setTextColor(...navy);
  doc.text(`Name: ${state.student.firstName} ${state.student.lastName}`, marginX + 14, y + 22);
  doc.text(`Section: ${state.student.section}`, marginX + 14, y + 40);
  const now = new Date();
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9.5);
  doc.setTextColor(...muted);
  doc.text(`Submitted: ${now.toLocaleString()}`, pageW - marginX - 14, y + 22, { align: "right" });
  y += 84;

  const total = Object.values(quizState).reduce((a,s) => a + s.score, 0);
  const max = topics.length * 5;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(...blue);
  doc.text(`Overall Score: ${total} / ${max}`, marginX, y);
  y += 24;

  topics.forEach((t, ti) => {
    const st = quizState[ti];
    ensureSpace(50);
    doc.setFillColor(...navy);
    doc.roundedRect(marginX, y, pageW - marginX*2, 26, 5, 5, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(11.5);
    doc.setTextColor(255,255,255);
    doc.text(`${ti+1}. ${t.title}`, marginX + 10, y + 17);
    const scoreLabel = st.checked ? `${st.score} / 5` : "Not attempted";
    doc.text(scoreLabel, pageW - marginX - 10, y + 17, { align: "right" });
    y += 36;

    t.quiz.forEach((q, qi) => {
      const picked = st.picked[qi];
      const isCorrect = picked === q.answer;
      const qLines = doc.setFont("helvetica","bold").setFontSize(10) && doc.splitTextToSize(`${qi+1}. ${q.q}`, pageW - marginX*2 - 20);
      ensureSpace(qLines.length * 12 + 34);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10);
      doc.setTextColor(...navy);
      doc.text(qLines, marginX + 10, y);
      y += qLines.length * 12 + 4;

      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);
      const yourAnswerText = picked !== undefined ? q.options[picked] : "(no answer selected)";
      doc.setTextColor(...(isCorrect ? green : blue));
      const yourLines = doc.splitTextToSize(`${isCorrect ? "✓" : "✗"} Your answer: ${yourAnswerText}`, pageW - marginX*2 - 20);
      doc.text(yourLines, marginX + 16, y);
      y += yourLines.length * 11 + 2;

      if(!isCorrect){
        doc.setTextColor(...muted);
        const correctLines = doc.splitTextToSize(`Correct answer: ${q.options[q.answer]}`, pageW - marginX*2 - 20);
        doc.text(correctLines, marginX + 16, y);
        y += correctLines.length * 11 + 2;
      }
      y += 6;
      ensureSpace(0);
    });
    y += 8;
  });

  const safe = (s) => (s||"").trim().replace(/[^a-z0-9]+/gi, "_");
  doc.save(`${safe(state.student.lastName)}_${safe(state.student.firstName)}_${safe(state.student.section)}_ESC33_Module.pdf`);
}

/* ---------------- Init: load a submitted copy if present ---------------- */
if(window.STUDENT_SUBMISSION){
  const data = window.STUDENT_SUBMISSION;
  state.student = data.student || state.student;
  state.locked = true;
  data.quiz.forEach((q, i) => {
    if(quizState[i]){
      quizState[i].picked = q.picked || {};
      quizState[i].checked = q.checked || false;
      quizState[i].score = q.score || 0;
    }
  });
  current = pages.length - 1;
}

render();
</script>
